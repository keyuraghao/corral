[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corral"
version = "0.1.0"
description = "A controller and CLI, MCP server, and web dashboard that herd a fleet of disposable worker nodes across machines and OSes and fan jobs out to them"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Keyur Aghao" }]
keywords = ["distributed", "orchestration", "security", "cve", "mcp", "model-context-protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12.0",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
mcp = ["mcp>=1.6"]
all = ["corral[mcp]"]
dev = [
  "corral[all]",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/keyuraghao/corral"
Repository = "https://github.com/keyuraghao/corral"
Issues = "https://github.com/keyuraghao/corral/issues"
Changelog = "https://github.com/keyuraghao/corral/blob/main/CHANGELOG.md"

[project.scripts]
corral = "corral.cli:main"
corral-mcp = "corral.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corral"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "packaging"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PL"]
ignore = [
  "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911",
  "RUF012", "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR", "S101", "E501"]
"scripts/*" = ["E402", "E501"]
"src/corral/mcp/server.py" = ["E501"]
"src/corral/dashboard/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["corral"]
omit = ["*/dashboard/*"]

[tool.uv]
package = true
