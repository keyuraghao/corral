<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corral Control</title>
<style>
  :root {
    --bg0: #06080d; --bg1: #0b1018; --panel: rgba(18,24,34,0.72); --border: #243043;
    --fg: #e6edf3; --muted: #8b98ab;
    --cyan: #39c5cf; --violet: #b16cff; --green: #3fb950; --red: #f85149; --amber: #e3a008; --blue: #4493f8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--fg);
    background: radial-gradient(1200px 800px at 70% -10%, #10203a 0%, var(--bg1) 45%, var(--bg0) 100%);
    overflow: hidden;
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
    padding: 12px 18px; background: linear-gradient(180deg, rgba(6,8,13,0.9), rgba(6,8,13,0.0));
    pointer-events: none;
  }
  #hud .brand { display: flex; align-items: center; gap: 10px; }
  #hud .brand b { color: var(--cyan); letter-spacing: 3px; font-size: 16px; text-shadow: 0 0 14px rgba(57,197,207,0.6); }
  #hud .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  #hud .dot.live { background: var(--green); box-shadow: 0 0 10px var(--green); animation: breathe 2s infinite; }
  @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .tiles { display: flex; gap: 10px; margin-left: auto; }
  .tile {
    min-width: 76px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--panel); backdrop-filter: blur(6px); text-align: center;
  }
  .tile .v { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .tile .k { font-size: 10px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; }
  .tile.cyan .v { color: var(--cyan); } .tile.blue .v { color: var(--blue); }
  .tile.green .v { color: var(--green); } .tile.red .v { color: var(--red); } .tile.violet .v { color: var(--violet); }
  #arena { position: fixed; inset: 0; z-index: 1; display: block; }
  #feed {
    position: fixed; right: 14px; bottom: 14px; z-index: 5; width: min(380px, 46vw); max-height: 42vh;
    overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
    backdrop-filter: blur(8px); font-size: 12px;
  }
  #feed h3 { margin: 0; padding: 8px 12px; font-size: 11px; letter-spacing: 2px; color: var(--muted);
    text-transform: uppercase; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; }
  #feed .lines { overflow-y: auto; max-height: calc(42vh - 34px); padding: 6px 12px; }
  #feed .lines div { padding: 1px 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed b { color: var(--fg); } #feed .n { color: var(--cyan); }
  #feed .ok { color: var(--green); } #feed .err { color: var(--red); } #feed .warn { color: var(--amber); }
  #tip {
    position: fixed; z-index: 6; pointer-events: none; display: none; padding: 8px 10px; font-size: 12px;
    border: 1px solid var(--border); border-radius: 8px; background: rgba(10,14,20,0.95); max-width: 260px;
  }
  #tip .t { color: var(--cyan); font-weight: 700; } #tip .m { color: var(--muted); }
  #legend { position: fixed; left: 14px; bottom: 14px; z-index: 5; color: var(--muted); font-size: 11px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 8px 12px; backdrop-filter: blur(6px); }
  #legend span { color: var(--fg); }
  #empty { position: fixed; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center;
    color: var(--muted); text-align: center; pointer-events: none; }
  @media (max-width: 620px) { .tiles { gap: 6px; } .tile { min-width: 56px; padding: 4px 7px; } .tile .v { font-size: 15px; } #feed { width: 92vw; } }
</style>
</head>
<body>
<div id="hud">
  <div class="brand"><span class="dot" id="live"></span><b>CORRAL</b></div>
  <div class="tiles">
    <div class="tile cyan"><div class="v" id="t-nodes">0</div><div class="k">nodes</div></div>
    <div class="tile blue"><div class="v" id="t-running">0</div><div class="k">running</div></div>
    <div class="tile green"><div class="v" id="t-done">0</div><div class="k">done</div></div>
    <div class="tile red"><div class="v" id="t-failed">0</div><div class="k">failed</div></div>
    <div class="tile violet"><div class="v" id="t-rate">100%</div><div class="k">success</div></div>
  </div>
</div>
<canvas id="arena"></canvas>
<div id="empty">waiting for workers to join the fleet…<br/>start one with <span style="color:var(--cyan)">corral worker</span></div>
<div id="feed"><h3><span>live feed</span><span id="feed-filter"></span></h3><div class="lines" id="feed-lines"></div></div>
<div id="legend">core = controller · pods = workers · orbs = tasks · <span>L</span>ocal <span>D</span>ocker <span>V</span>m <span>A</span>gent</div>
<div id="tip"></div>
<script>
"use strict";
const esc = s => String(s==null?"":s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const COLORS = { cyan:"#39c5cf", violet:"#b16cff", green:"#3fb950", red:"#f85149", amber:"#e3a008", blue:"#4493f8", muted:"#8b98ab" };
const OS_COLOR = { linux:"#f0b429", windows:"#4493f8", darwin:"#d7dbe0", macos:"#d7dbe0" };
const STATE_COLOR = { succeeded:COLORS.green, failed:COLORS.red, timeout:COLORS.red, cancelled:COLORS.amber, running:COLORS.cyan, dispatched:COLORS.blue };
const easeInOut = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

const canvas = document.getElementById("arena"), ctx = canvas.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+"px"; canvas.style.height=H+"px"; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); }
window.addEventListener("resize", resize);

const nodes = new Map();   // node_id -> sprite
const taskNode = new Map(); // task_id -> node_id
let orbs = [], particles = [];
const stats = { done:0, failed:0, running:0 };
let filter = null;
const core = { x:0, y:0, pulse:0, r:34 };

function layout(){
  core.x = W/2; core.y = H/2 + 10;
  const list = [...nodes.values()];
  const n = list.length || 1;
  const radius = Math.min(W,H) * (n>8?0.36:0.30) + Math.min(n*6,70);
  list.forEach((s,i)=>{ const a = -Math.PI/2 + i*(2*Math.PI/n); s.tx = core.x + Math.cos(a)*radius; s.ty = core.y + Math.sin(a)*radius;
    if(s.x===undefined){ s.x=core.x; s.y=core.y; } s.angle=a; });
}

function addNode(info){
  if(nodes.has(info.node_id)) { nodes.get(info.node_id).info = info; return; }
  nodes.set(info.node_id, { id:info.node_id, info, x:undefined, y:undefined, tx:0, ty:0, busy:0, glow:0, bornAt:performance.now(), scale:0 });
  layout();
}
function removeNode(id){ const s=nodes.get(id); if(s){ burst(s.x,s.y,COLORS.muted,10); nodes.delete(id); layout(); } }

function spawnOrb(nodeId, kind, color){
  const s = nodes.get(nodeId); if(!s) return;
  const from = kind==="out" ? {x:core.x,y:core.y} : {x:s.x,y:s.y};
  const to   = kind==="out" ? {x:s.x,y:s.y} : {x:core.x,y:core.y};
  const mx=(from.x+to.x)/2, my=(from.y+to.y)/2, nx=-(to.y-from.y), ny=(to.x-from.x);
  const len=Math.hypot(nx,ny)||1, off=(Math.random()*60-30);
  orbs.push({from,to, cx:mx+nx/len*off, cy:my+ny/len*off, t:0, dur:620+Math.random()*260, color:color||COLORS.cyan, node:nodeId, kind, born:performance.now()});
}
function burst(x,y,color,count){
  for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color,size:1.5+Math.random()*2}); }
}
function spark(nodeId, color){ const s=nodes.get(nodeId); if(!s) return;
  const a=Math.random()*Math.PI*2; particles.push({x:s.x,y:s.y,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5-0.5,life:0.8,color:color||COLORS.cyan,size:1.5}); }

function osColor(info){ return OS_COLOR[(info.os||"").toLowerCase()] || COLORS.violet; }
function execBadge(info){ const m={local:"L",docker:"D",vm:"V",agent:"A"}; return (info.executors||[]).map(e=>m[e]||"?").join(""); }

function draw(now){
  ctx.clearRect(0,0,W,H);
  // faint grid
  ctx.globalAlpha=0.25; ctx.strokeStyle="#0f1824"; ctx.lineWidth=1;
  for(let x=0;x<W;x+=46){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=46){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.globalAlpha=1;

  // links
  for(const s of nodes.values()){
    const busy = s.busy>0;
    ctx.strokeStyle = busy ? "rgba(57,197,207,0.5)" : "rgba(60,80,110,0.22)";
    ctx.lineWidth = busy ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(core.x,core.y); ctx.lineTo(s.x,s.y); ctx.stroke();
  }

  // orbs
  orbs = orbs.filter(o=>{
    o.t = Math.min(1,(now-o.born)/o.dur); const e=easeInOut(o.t), u=1-e;
    const x=u*u*o.from.x+2*u*e*o.cx+e*e*o.to.x, y=u*u*o.from.y+2*u*e*o.cy+e*e*o.to.y;
    ctx.save(); ctx.shadowColor=o.color; ctx.shadowBlur=18; ctx.fillStyle=o.color;
    ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill();
    ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(x,y,2.4,0,7); ctx.fillStyle="#fff"; ctx.fill(); ctx.restore();
    if(o.t>=1){ const s=nodes.get(o.node); if(s){ if(o.kind==="out"){ s.busy++; s.glow=1; spark(o.node,o.color);} else { burst(x,y,o.color,12);} } return false; }
    return true;
  });

  // particles
  particles = particles.filter(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.life-=0.02;
    if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); ctx.globalAlpha=1; return true; });

  // core
  core.pulse*=0.94;
  const cr = core.r + core.pulse*10 + Math.sin(now/600)*2;
  const g = ctx.createRadialGradient(core.x,core.y,4,core.x,core.y,cr+18);
  g.addColorStop(0,"rgba(57,197,207,0.9)"); g.addColorStop(0.6,"rgba(57,197,207,0.18)"); g.addColorStop(1,"rgba(57,197,207,0)");
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(core.x,core.y,cr+18,0,7); ctx.fill();
  ctx.save(); ctx.shadowColor=COLORS.cyan; ctx.shadowBlur=24; ctx.strokeStyle=COLORS.cyan; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(core.x,core.y,cr,0,7); ctx.stroke();
  ctx.rotate(now/2400); ctx.restore();
  ctx.fillStyle=COLORS.cyan; ctx.font="700 11px ui-monospace,monospace"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("CTRL", core.x, core.y);

  // nodes
  for(const s of nodes.values()){
    s.x += (s.tx-s.x)*0.12; s.y += (s.ty-s.y)*0.12;
    s.scale += ((1)-s.scale)*0.1; s.glow*=0.95;
    const col = osColor(s.info), R = 26*s.scale;
    if(s.busy>0){ ctx.save(); ctx.strokeStyle=COLORS.cyan; ctx.globalAlpha=0.6; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(s.x,s.y,R+6+Math.sin(now/180)*2,0,7); ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=10+s.glow*22;
    ctx.fillStyle="rgba(12,18,26,0.95)"; ctx.strokeStyle=col; ctx.lineWidth=2;
    hexagon(s.x,s.y,R); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle=col; ctx.font="700 10px ui-monospace,monospace";
    ctx.fillText(execBadge(s.info), s.x, s.y-3);
    ctx.fillStyle=COLORS.muted; ctx.font="9px ui-monospace,monospace";
    ctx.fillText((s.info.os||"?"), s.x, s.y+8);
    ctx.fillStyle=s.busy>0?COLORS.cyan:COLORS.muted; ctx.font="10px ui-monospace,monospace";
    ctx.fillText(clip(s.id,14), s.x, s.y+R+12);
  }
  requestAnimationFrame(draw);
}
function hexagon(x,y,r){ ctx.beginPath(); for(let i=0;i<6;i++){ const a=Math.PI/6+i*Math.PI/3; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py);} ctx.closePath(); }
function clip(s,n){ s=String(s); return s.length>n?s.slice(0,n-1)+"…":s; }

// ---- data + events ----
function setTiles(){ document.getElementById("t-nodes").textContent=nodes.size;
  document.getElementById("t-running").textContent=stats.running;
  document.getElementById("t-done").textContent=stats.done;
  document.getElementById("t-failed").textContent=stats.failed;
  const total=stats.done+stats.failed; const rate=total?Math.round(stats.done/total*100):100;
  document.getElementById("t-rate").textContent=rate+"%";
  document.getElementById("empty").style.display = nodes.size? "none":"flex"; }

function feed(html, cls){ const box=document.getElementById("feed-lines"); const d=document.createElement("div");
  const t=new Date().toLocaleTimeString(); d.innerHTML=`<span class="n">${t}</span> ${html}`; if(cls) d.classList.add(cls);
  box.prepend(d); while(box.childNodes.length>120) box.removeChild(box.lastChild); }

async function seed(){ try{
  const nres=await fetch("/api/nodes"); const ns=(await nres.json()).nodes||[]; ns.forEach(n=>addNode(n.info)); setTiles();
}catch(e){} }

function onEvent(m){
  const d=m.data||{};
  if(m.event==="node_connected"){ addNode(d.info); feed(`<b>+ node</b> <span class="n">${esc(d.node_id)}</span> joined`); setTiles(); }
  else if(m.event==="node_disconnected"){ removeNode(d.node_id); feed(`<b>- node</b> ${esc(d.node_id)} left`); setTiles(); }
  else if(m.event==="job_submitted"){ const a=d.assignments||[]; core.pulse=1;
    a.forEach(x=>{ taskNode.set(x.task_id,x.node_id); spawnOrb(x.node_id,"out",COLORS.blue); });
    feed(`<b>job</b> ${esc((d.job&&d.job.spec&&d.job.spec.name)||d.job.job_id)} → ${a.length} node(s)`); stats.running+=a.length; setTiles(); }
  else if(m.event==="task_log"){ const nid=d.node_id||taskNode.get(d.task_id); if(nid) spark(nid, d.stream==="stderr"?COLORS.amber:COLORS.cyan);
    if(!filter || filter===nid){ feed(`<span class="n">${esc(clip(nid||"?",12))}</span> ${esc(clip(d.line,70))}`, d.stream==="stderr"?"warn":null); } }
  else if(m.event==="task_update"){ const nid=d.node_id||taskNode.get(d.task_id); const st=d.state;
    const terminal=["succeeded","failed","timeout","cancelled"].includes(st);
    if(terminal){ const s=nodes.get(nid); if(s){ s.busy=Math.max(0,s.busy-1); } spawnOrb(nid,"back",STATE_COLOR[st]||COLORS.muted);
      stats.running=Math.max(0,stats.running-1); if(st==="succeeded")stats.done++; else stats.failed++;
      feed(`<span class="n">${esc(clip(nid||"?",12))}</span> task <b class="${st==="succeeded"?"ok":"err"}">${st}</b>`, st==="succeeded"?"ok":"err"); setTiles(); }
  }
  else if(m.event==="job_done"){ core.pulse=1; }
}

function connect(){ const proto=location.protocol==="https:"?"wss":"ws"; const ws=new WebSocket(`${proto}://${location.host}/ws/events`);
  const dot=document.getElementById("live");
  ws.onopen=()=>dot.classList.add("live"); ws.onclose=()=>{dot.classList.remove("live"); setTimeout(connect,2000);};
  ws.onmessage=ev=>{ let m; try{m=JSON.parse(ev.data);}catch(e){return;} onEvent(m); };
}

// hover tooltip + click to filter feed
canvas.addEventListener("mousemove", e=>{ const tip=document.getElementById("tip"); let hit=null;
  for(const s of nodes.values()){ if(Math.hypot(e.clientX-s.x,e.clientY-s.y)<28){ hit=s; break; } }
  if(hit){ tip.style.display="block"; tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY+14)+"px";
    tip.innerHTML=`<div class="t">${esc(hit.id)}</div><div class="m">${esc(hit.info.os)}/${esc(hit.info.arch)} · ${esc((hit.info.executors||[]).join(","))}</div>`
      +`<div class="m">labels: ${esc((hit.info.labels||[]).join(",")||"none")}</div><div class="m">${hit.busy>0?("running "+hit.busy):"idle"}</div>`;
  } else { tip.style.display="none"; } });
canvas.addEventListener("click", e=>{ let hit=null; for(const s of nodes.values()){ if(Math.hypot(e.clientX-s.x,e.clientY-s.y)<28){hit=s;break;} }
  filter = hit && filter!==hit.id ? hit.id : null;
  document.getElementById("feed-filter").textContent = filter?("↳ "+clip(filter,12)):""; });

resize(); seed(); connect(); requestAnimationFrame(draw);
setInterval(async()=>{ try{ const ns=(await (await fetch("/api/nodes")).json()).nodes||[];
  const live=new Set(ns.map(n=>n.info.node_id)); ns.forEach(n=>addNode(n.info));
  for(const id of [...nodes.keys()]) if(!live.has(id)) removeNode(id); setTiles(); }catch(e){} }, 5000);
</script>
</body>
</html>
